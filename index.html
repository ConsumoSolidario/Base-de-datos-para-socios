<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumo Solidario de Canasta Básica</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1, h2 {
            color: #2c3e50;
            text-align: center;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: #fafafa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #219653;
        }
        .rule-box {
            background-color: #e8f8f5;
            border: 1px solid #a3e4d7;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🛒 Consumo Solidario de Canasta Básica</h1>
    <p style="text-align: center; color: #7f8c8d;">Registro de Socios y Control de Puntos</p>
    
    <div class="grid">
        <!-- SECCIÓN 1: REGISTRO -->
        <div class="card">
            <h2>👥 Registrar Nuevo Socio</h2>
            <form id="formRegistro">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" required placeholder="Ej. Juan Pérez">

                <label for="telefono">Número Telefónico:</label>
                <input type="tel" id="telefono" required placeholder="Ej. 5512345678">

                <label for="curp">CURP:</label>
                <input type="text" id="curp" required placeholder="18 caracteres" maxlength="18" style="text-transform: uppercase;">

                <button type="button" onclick="registrarSocio()">Guardar Socio</button>
            </form>
        </div>

        <!-- SECCIÓN 2: CONFIGURACIÓN Y COMPRAS -->
        <div class="card">
            <div class="card rule-box" style="margin-bottom: 15px; padding: 15px;">
                <label for="reglaPuntos" style="color: #117a65;">⚙️ Regla de Puntos:</label>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span>Cada $</span>
                    <input type="number" id="reglaPuntos" value="10" min="1" style="margin: 0; width: 80px; padding: 5px;">
                    <span>pesos gastados = 1 punto.</span>
                </div>
            </div>

            <h2>💰 Registrar Compra</h2>
            <form id="formCompra">
                <label for="seleccionarSocio">Seleccionar Socio:</label>
                <select id="seleccionarSocio">
                    <option value="">-- Selecciona un socio --</option>
                </select>

                <label for="montoCompra">Monto Total de la Compra ($):</label>
                <input type="number" id="montoCompra" min="1" placeholder="Ej. 150">

                <button type="button" onclick="sumarPuntos()" style="background-color: #2980b9;">Agregar Puntos</button>
            </form>
        </div>
    </div>

    <!-- SECCIÓN 3: TABLA DE DATOS -->
    <h2>📋 Lista de Socios Registrados</h2>
    <table>
        <thead>
            <tr>
                <th>CURP</th>
                <th>Nombre Completo</th>
                <th>Teléfono</th>
                <th>Puntos Acumulados</th>
            </tr>
        </thead>
        <tbody id="tablaSocios">
            <!-- Los datos aparecerán aquí dinámicamente -->
        </tbody>
    </table>
</div>

<script>
    // Base de datos en memoria (un diccionario/objeto de JavaScript)
    let socios = {};

    // Función para registrar un socio
    function registrarSocio() {
        const nombre = document.getElementById('nombre').value.trim();
        const telefono = document.getElementById('telefono').value.trim();
        const curp = document.getElementById('curp').value.trim().toUpperCase();

        if(nombre === "" || telefono === "" || curp === "") {
            alert("Por favor, llena todos los campos del registro.");
            return;
        }

        if(socios[curp]) {
            alert("Este CURP ya se encuentra registrado.");
            return;
        }

        // Guardamos los datos del socio usando el CURP como clave única
        socios[curp] = {
            nombre: nombre,
            telefono: telefono,
            puntos: 0
        };

        alert("¡Socio registrado con éxito!");
        document.getElementById('formRegistro').reset();
        actualizarInterfaz();
    }

    // Función para sumar puntos según la regla modificable
    function sumarPuntos() {
        const curpSocio = document.getElementById('seleccionarSocio').value;
        const monto = parseFloat(document.getElementById('montoCompra').value);
        const pesosPorPunto = parseFloat(document.getElementById('reglaPuntos').value);

        if(!curpSocio) {
            alert("Por favor, selecciona un socio de la lista.");
            return;
        }
        if(isNaN(monto) || monto <= 0) {
            alert("Por favor, ingresa un monto de compra válido.");
            return;
        }
        if(isNaN(pesosPorPunto) || pesosPorPunto <= 0) {
            alert("Por favor, define una regla de puntos válida (mayor a 0).");
            return;
        }

        // Calculamos los puntos (usamos Math.floor para dar puntos enteros)
        const puntosGanados = Math.floor(monto / pesosPorPunto);
        
        // Sumamos los puntos al socio seleccionado
        socios[curpSocio].puntos += puntosGanados;

        alert(`Se han sumado ${puntosGanados} puntos a ${socios[curpSocio].nombre}.`);
        document.getElementById('montoCompra').value = "";
        actualizarInterfaz();
    }

    // Función para mantener la tabla y la lista desplegable al día
    function actualizarInterfaz() {
        const tabla = document.getElementById('tablaSocios');
        const select = document.getElementById('seleccionarSocio');
        
        // Limpiamos los elementos visuales antes de redibujar
        tabla.innerHTML = "";
        select.innerHTML = '<option value="">-- Selecciona un socio --</option>';

        // Recorremos nuestro diccionario de socios
        for (const curp in socios) {
            const socio = socios[curp];

            // 1. Añadir a la tabla de visualización
            const fila = `<tr>
                <td>${curp}</td>
                <td>${socio.nombre}</td>
                <td>${socio.telefono}</td>
                <td style="font-weight: bold; color: #27ae60;">${socio.puntos}</td>
            </tr>`;
            tabla.innerHTML += fila;

            // 2. Añadir a la lista de selección para compras
            const opcion = document.createElement('option');
            opcion.value = curp;
            opcion.textContent = `${socio.nombre} (${curp})`;
            select.appendChild(opcion);
        }
    }
</script>

</body>
</html>
